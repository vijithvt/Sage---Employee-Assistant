# Run the full stack with: docker compose up --build
# Optionally copy .env.example to .env at the repo root to override defaults.
# No external API key is required — LLM generation runs locally via Ollama.
# The first run pulls the local model (a couple of GB), so it takes longer
# than subsequent starts; the model is cached in the ollama_data volume.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - kb-network

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/raw_docs:/app/data/raw_docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - kb-network

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge

volumes:
  ollama_data:
